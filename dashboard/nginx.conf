server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;   # docker DNS: nginx стартует даже если backend ещё не поднят

  location / { try_files $uri $uri/ /index.html; }

  location /api/ { set $b http://backend:8000; proxy_pass $b; proxy_read_timeout 30s; }
  location /ws {
    set $b http://backend:8000;
    proxy_pass $b;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location /feeder/ {
    set $f http://feeder:8090;
    rewrite ^/feeder/(.*)$ /$1 break;
    proxy_pass $f;
  }
}
