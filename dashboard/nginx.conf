server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;   # docker DNS: nginx стартует даже если backend ещё не поднят
  client_max_body_size 64m;                 # загрузка GTFS

  location / { try_files $uri $uri/ /index.html; }

  # upstream через переменную — имя резолвится на запрос, а не на старте (backend может перезапускаться);
  # 180 с — импорт из OSM перебирает зеркала Overpass
  location /api/ { set $b http://backend:8000; proxy_pass $b; proxy_read_timeout 180s; }
  location /ws {
    set $b http://backend:8000;
    proxy_pass $b;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;               # снимки идут раз в секунду; таймаут — только на мёртвый сокет
  }
  # демо-управление потоком (пауза, скорость, обрыв) с дашборда; префикс /feeder снимается
  location /feeder/ {
    set $f http://feeder:8090;
    rewrite ^/feeder/(.*)$ /$1 break;
    proxy_pass $f;
  }
}
